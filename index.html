<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxy Parfums | Alta Perfumaria Árabe</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luxGold: '#C5A059',
                        luxGoldLight: '#E8D3A2',
                        luxDark: '#111111',
                        luxCreme: '#FDFBF7',
                        success: '#10B981',
                        whatsGreen: '#25D366'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #FDFBF7; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animações de Entrada */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Gráfico de Barras Animado */
        .bar-fill { animation: fillBar 1s ease-out forwards; transform-origin: left; }
        @keyframes fillBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        
        /* Carrossel Infinito das Notas Olfativas */
        @keyframes marquee { 
            0% { transform: translateX(0%); } 
            100% { transform: translateX(-50%); } 
        }
        .animate-marquee {
            display: inline-flex;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
        
        .line-clamp-custom { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .expanded-text { -webkit-line-clamp: unset; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
</head>
<body class="font-sans text-gray-900 selection:bg-luxGold selection:text-white flex flex-col min-h-screen bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-fixed">

    <!-- HEADER MINIMALISTA & LUXUOSO -->
    <header class="fixed top-0 w-full z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 h-16 transition-all duration-300 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
            <div id="header-left" class="flex items-center w-1/4"></div>

            <div onclick="goHome()" class="flex flex-col items-center justify-center cursor-pointer w-2/4">
                <div class="flex items-center gap-1.5 text-luxGold mb-0.5">
                    <i data-lucide="crown" class="w-5 h-5" stroke-width="2"></i>
                    <h1 class="font-serif text-xl font-bold tracking-widest uppercase text-luxDark">Luxy</h1>
                </div>
                <span class="text-[7px] tracking-[0.3em] text-gray-500 uppercase font-medium">Perfumaria Exclusiva</span>
            </div>

            <div class="flex items-center justify-end w-1/4">
                <button onclick="toggleCart(true)" class="relative p-2 text-gray-800 hover:text-luxGold transition-colors">
                    <i data-lucide="shopping-bag" class="w-5 h-5" stroke-width="1.5"></i>
                    <span id="cart-badge" class="hidden absolute top-0.5 right-0.5 bg-luxDark text-white text-[9px] font-bold h-4 w-4 rounded-full flex items-center justify-center shadow-md">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <div id="app-root" class="pt-16 fade-in flex-grow"></div>

    <!-- CARRINHO LATERAL (DRAWER) -->
    <div id="cart-overlay" class="fixed inset-0 bg-luxDark/60 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleCart(false)">
        <div id="cart-drawer" class="absolute top-0 right-0 h-full w-[85%] max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-400 ease-in-out flex flex-col" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between p-5 border-b border-gray-100 bg-white">
                <h2 class="font-serif text-xl text-gray-900 flex items-center gap-2">
                    Sacola <span id="cart-count-header" class="bg-gray-100 text-gray-600 text-[10px] font-sans px-2 py-0.5 rounded-full font-bold">0</span>
                </h2>
                <button onclick="toggleCart(false)" class="p-2 text-gray-400 hover:text-gray-900 rounded-full bg-gray-50"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50"></div>
            <div id="cart-footer" class="hidden border-t border-gray-100 p-5 bg-white pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
                <div class="flex justify-between items-end mb-4">
                    <span class="text-gray-500 text-xs uppercase tracking-widest font-semibold">Subtotal</span>
                    <span id="cart-total" class="font-serif text-2xl font-bold text-gray-900">R$ 0,00</span>
                </div>
                <button onclick="handleWhatsAppCheckout()" class="w-full bg-luxDark text-white py-4 rounded-xl text-sm uppercase tracking-widest font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-black/10 hover:bg-black">
                    <i data-lucide="lock" class="w-4 h-4 text-luxGold"></i> Finalizar Pedido
                </button>
                <p class="text-[9px] text-center text-gray-400 mt-3 font-medium uppercase tracking-wider">Pagamento e Envio combinados no WhatsApp</p>
            </div>
        </div>
    </div>

    <script>
        // --- DADOS ESTRATÉGICOS DE NEUROMARKETING (Atualizados com Notas com Emojis) ---
        const catalog = [
            {
                id: 7,
                name: "Art of Arabia I - Lattafa Pride",
                brand: "Lattafa Pride",
                shortDescription: "Incomoda quem passa despercebida. O verdadeiro ouro líquido que anuncia a sua chegada.",
                fullDescription: "A joia da coroa da nossa coleção. Uma fragrância majestosa que captura a essência da realeza árabe. Com uma abertura marcante de especiarias e açafrão, evolui para um coração sedutor de rosas e finaliza com o mais puro Oud. Feito para quem não tem medo de ser notado e lembrado. Fixação que resiste a banhos.",
                price: 550.00,
                installments: 4,
                image: "https://i.postimg.cc/W414kM1T/shopping-(6).webp",
                tags: ["Alto Luxo"],
                profile: "Para Todos", 
                vibe: "Para Todos",
                fixation: "Extrema (+15h)",
                projection: "Preenche o ambiente",
                notesCarousel: "🌶️ Especiarias • 🌹 Rosa de Damasco • 🪵 Oud Cambojano • 🍯 Âmbar",
                accords: [
                    { name: "Amadeirado (Oud)", level: 95, color: "bg-amber-900 text-white" },
                    { name: "Especiado Quente", level: 80, color: "bg-orange-700 text-white" },
                    { name: "Floral Sedutor", level: 60, color: "bg-rose-500 text-white" }
                ]
            },
            {
                id: 5,
                name: "Asad Elixir Lattafa - EDP 100ml",
                brand: "Lattafa",
                shortDescription: "O cheiro do homem bem-sucedido. Sombrio, elegante e magnético.",
                fullDescription: "Asad Elixir não é um perfume, é uma declaração de poder. Traz uma mistura inusitada de pimenta preta, abacaxi maduro e madeiras secas. Uma fragrância imponente que transmite masculinidade e seriedade. Perfeito para reuniões de negócios ou encontros onde você precisa dominar o ambiente.",
                price: 419.90,
                installments: 4,
                image: "https://i.postimg.cc/QtWhQSL6/shopping-(2).webp",
                tags: ["Imponente"],
                profile: "Para Ele",
                vibe: "Para Ele",
                fixation: "Alta (+12h)",
                projection: "Elegante e constante",
                notesCarousel: "🖤 Pimenta Preta • 🍍 Abacaxi • ☕ Café • 🪵 Madeiras Secas",
                accords: [
                    { name: "Especiado Fresco", level: 85, color: "bg-zinc-800 text-white" },
                    { name: "Amadeirado Seco", level: 80, color: "bg-amber-800 text-white" },
                    { name: "Frutado Escuro", level: 60, color: "bg-purple-900 text-white" }
                ]
            },
            {
                id: 2,
                name: "Decant - Yara Moi Lattafa",
                brand: "Lattafa",
                shortDescription: "Feminino, cremoso e irresistível. O famoso 'cheiro de princesa árabe'.",
                fullDescription: "O Yara Moi é uma febre mundial por um motivo: é um gourmand que não enjoa. Notas de pêssego suculento, caramelo derretido e sândalo cremoso. Passa uma vibe limpa, romântica e extremamente sedutora para o dia a dia. Experimente o decant e apaixone-se.",
                price: 24.90,
                installments: 4,
                image: "https://i.postimg.cc/FsXsZtK5/shopping-(4).webp",
                tags: ["Trend TikTok"],
                profile: "Para Ela",
                vibe: "Para Ela",
                fixation: "Moderada (+8h)",
                projection: "Intensa nas primeiras 2h",
                notesCarousel: "🍑 Pêssego Suave • 🌸 Jasmim • 🍮 Caramelo • 🪵 Sândalo",
                accords: [
                    { name: "Frutado", level: 85, color: "bg-orange-300 text-gray-900" },
                    { name: "Doce / Cremoso", level: 80, color: "bg-pink-300 text-gray-900" },
                    { name: "Sândalo", level: 70, color: "bg-yellow-700 text-white" }
                ]
            },
            {
                id: 6,
                name: "Decant - Club de Nuit Intense Man Armaf",
                brand: "Armaf",
                shortDescription: "Elegância e sofisticação inigualáveis. A assinatura do homem moderno.",
                fullDescription: "Uma fragrância majestosa que exala luz. A suculência das frutas cítricas combinada com a potência da madeira de bétula. Fresco, cortante e extremamente elogiado. Se você quer um perfume que renda elogios de todos ao redor, esta é a escolha certa.",
                price: 27.90,
                oldPrice: 35.45,
                installments: 4,
                image: "https://i.postimg.cc/j24VcFMX/shopping-(1).webp",
                tags: ["Mais Vendido"],
                profile: "Para Ele",
                vibe: "Para Ele",
                fixation: "Alta (+10h)",
                projection: "Deixa rastro longo",
                notesCarousel: "🍋 Limão Siciliano • 🍍 Abacaxi • 🌹 Rosa • 🪵 Madeira de Bétula",
                accords: [
                    { name: "Cítrico Fresco", level: 90, color: "bg-yellow-400 text-gray-900" },
                    { name: "Amadeirado Defumado", level: 75, color: "bg-zinc-600 text-white" },
                    { name: "Frutado", level: 60, color: "bg-green-400 text-gray-900" }
                ]
            }
        ];

        // Filtros Intuitivos Simplificados (Removido Assinatura/VIP, Adicionado Para Todos)
        const filterCategories = [
            { id: 'all', label: 'Toda Coleção', icon: 'sparkles' },
            { id: 'Para Todos', label: 'Para Todos', icon: 'users' },
            { id: 'Para Ela', label: 'Para Ela', icon: 'flower-2' },
            { id: 'Para Ele', label: 'Para Ele', icon: 'briefcase' },
            { id: 'Noite & Sedução', label: 'Noite & Sedução', icon: 'moon-star' }
        ];

        let cart = [];
        let currentView = 'home';
        let selectedProductId = null;
        let activeFilter = 'all';

        const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        const renderIcons = () => setTimeout(() => lucide.createIcons(), 10);

        // --- NAVEGAÇÃO ---
        window.goHome = () => {
            currentView = 'home';
            selectedProductId = null;
            renderApp();
            window.scrollTo(0, 0);
        };

        window.goToProduct = (id) => {
            currentView = 'product';
            selectedProductId = id;
            renderApp();
            window.scrollTo(0, 0);
        };

        window.setFilter = (filterId) => {
            activeFilter = filterId;
            renderApp();
        };

        window.toggleReadMore = () => {
            const desc = document.getElementById('product-desc');
            const btn = document.getElementById('read-more-btn');
            if (desc.classList.contains('line-clamp-custom')) {
                desc.classList.remove('line-clamp-custom');
                btn.innerHTML = 'Ler menos <i data-lucide="chevron-up" class="w-3 h-3"></i>';
            } else {
                desc.classList.add('line-clamp-custom');
                btn.innerHTML = 'Ler descrição completa <i data-lucide="chevron-down" class="w-3 h-3"></i>';
            }
            renderIcons();
        };

        // --- CARRINHO ---
        window.toggleCart = (isOpen) => {
            const overlay = document.getElementById('cart-overlay');
            const drawer = document.getElementById('cart-drawer');
            if (isOpen) {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlay.classList.add('opacity-100', 'pointer-events-auto');
                drawer.classList.remove('translate-x-full');
                drawer.classList.add('translate-x-0');
                document.body.style.overflow = 'hidden';
            } else {
                overlay.classList.remove('opacity-100', 'pointer-events-auto');
                overlay.classList.add('opacity-0', 'pointer-events-none');
                drawer.classList.remove('translate-x-0');
                drawer.classList.add('translate-x-full');
                document.body.style.overflow = '';
            }
        };

        window.addToCart = (id, event) => {
            if(event) event.stopPropagation();
            const product = catalog.find(p => p.id === id);
            const item = cart.find(i => i.product.id === id);
            if (item) item.quantity++; else cart.push({ product, quantity: 1 });
            updateCartUI();
            toggleCart(true);
        };

        window.updateQuantity = (id, delta) => {
            const item = cart.find(i => i.product.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) cart = cart.filter(i => i.product.id !== id);
            }
            updateCartUI();
        };

        window.removeFromCart = (id) => {
            cart = cart.filter(i => i.product.id !== id);
            updateCartUI();
        };

        const updateCartUI = () => {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

            document.getElementById('cart-count-header').textContent = count;
            const badge = document.getElementById('cart-badge');
            
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
                document.getElementById('cart-footer').classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                document.getElementById('cart-footer').classList.add('hidden');
            }

            document.getElementById('cart-total').textContent = formatCurrency(total);
            const container = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-40 text-gray-400">
                        <i data-lucide="shopping-cart" class="w-8 h-8 mb-2 opacity-50"></i>
                        <p class="text-xs font-medium">Sua sacola está vazia</p>
                    </div>`;
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex gap-3 bg-white p-3 rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-50 relative">
                        <div class="w-16 h-20 bg-gray-50 rounded-lg p-1 flex items-center justify-center">
                            <img src="${item.product.image}" class="max-w-full max-h-full object-contain mix-blend-multiply" />
                        </div>
                        <div class="flex-1 flex flex-col justify-center pr-5">
                            <p class="text-[9px] text-gray-400 uppercase font-semibold">${item.product.brand}</p>
                            <h4 class="text-xs font-bold text-gray-900 leading-tight line-clamp-1 mb-1">${item.product.name}</h4>
                            <span class="font-bold text-sm text-luxGold">${formatCurrency(item.product.price * item.quantity)}</span>
                            
                            <div class="flex items-center gap-3 mt-2 bg-gray-50 w-fit rounded-lg px-2 py-1 border border-gray-100">
                                <button onclick="updateQuantity(${item.product.id}, -1)" class="text-gray-500"><i data-lucide="minus" class="w-3 h-3"></i></button>
                                <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.product.id}, 1)" class="text-gray-500"><i data-lucide="plus" class="w-3 h-3"></i></button>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.product.id})" class="absolute top-3 right-3 text-gray-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `).join('');
            }
            renderIcons();
        };

        window.handleWhatsAppCheckout = () => {
            if (cart.length === 0) return;
            const phone = "5592984215022";
            let msg = "Olá, *Luxy Parfums*! ✨\nQuero garantir meu pedido exclusivo:\n\n";
            cart.forEach(item => { msg += `🔸 ${item.quantity}x ${item.product.name} (${formatCurrency(item.product.price)})\n`; });
            const total = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            msg += `\n*Total: ${formatCurrency(total)}*\n\nComo faço o pagamento?`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        // --- RENDERIZAÇÃO HOME ---
        const renderProductCard = (p) => {
            let badgeHtml = '';
            if (p.oldPrice) badgeHtml = `<div class="absolute top-2 left-2 bg-luxDark text-white text-[8px] uppercase tracking-widest font-bold px-2 py-1 rounded z-10 shadow-md">Oferta</div>`;
            else if (p.tags[0]) badgeHtml = `<div class="absolute top-2 left-2 bg-luxGold text-white text-[8px] uppercase tracking-widest font-bold px-2 py-1 rounded z-10 shadow-md">${p.tags[0]}</div>`;

            return `
                <div onclick="goToProduct(${p.id})" class="group cursor-pointer flex flex-col bg-white rounded-2xl overflow-hidden shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-gray-100 hover:shadow-xl transition-all relative">
                    ${badgeHtml}
                    <div class="relative w-full aspect-[4/5] bg-[#FAFAFA] p-4 flex justify-center items-center">
                        <img src="${p.image}" class="w-full h-full object-contain drop-shadow-xl transform group-hover:scale-105 transition-transform duration-500 mix-blend-multiply" />
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow bg-white">
                        <p class="text-[9px] text-luxGold uppercase tracking-widest font-bold mb-1">${p.brand}</p>
                        <h4 class="font-serif text-sm font-bold text-gray-900 leading-tight mb-2 line-clamp-2">${p.name}</h4>
                        <p class="text-[10px] text-gray-500 font-medium italic line-clamp-2 mb-4 leading-relaxed">"${p.shortDescription}"</p>
                        
                        <div class="mt-auto flex items-end justify-between">
                            <div>
                                ${p.oldPrice ? `<span class="text-[10px] text-gray-400 line-through block mb-0.5">${formatCurrency(p.oldPrice)}</span>` : ''}
                                <span class="font-bold text-base text-luxDark">${formatCurrency(p.price)}</span>
                            </div>
                            <button onclick="addToCart(${p.id}, event)" class="bg-luxDark text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-luxGold transition-colors shadow-md">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        const getHomeHTML = () => {
            const filtered = activeFilter === 'all' 
                ? catalog 
                : catalog.filter(p => p.profile === activeFilter || p.vibe === activeFilter || (activeFilter === 'Para Todos' && p.profile === 'Para Todos'));

            let html = `
                <!-- Hero Banner -->
                <section class="bg-luxDark text-white py-12 px-4 text-center relative overflow-hidden">
                    <div class="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1615634260167-c8cdede054de?auto=format&fit=crop&q=80&w=1000')] bg-cover bg-center"></div>
                    <div class="absolute inset-0 bg-gradient-to-b from-luxDark/80 to-luxDark"></div>
                    <div class="relative z-10 max-w-2xl mx-auto">
                        <span class="text-luxGold text-[10px] uppercase tracking-[0.3em] font-bold mb-3 block">Descubra sua Assinatura</span>
                        <h2 class="font-serif text-3xl sm:text-4xl font-bold mb-4 leading-tight">O cheiro que anuncia a sua chegada.</h2>
                        <p class="text-gray-300 text-xs sm:text-sm font-light max-w-md mx-auto">Fragrâncias exclusivas com fixação extrema. Encontre o perfume perfeito para a sua vibe de hoje.</p>
                    </div>
                </section>

                <main class="max-w-5xl mx-auto px-4 py-8">
                    <!-- Filtros por Vibe/Ocasião -->
                    <div class="mb-8">
                        <h3 class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-4 px-1">Encontre por Perfil</h3>
                        <div class="flex overflow-x-auto hide-scrollbar gap-3 pb-2 -mx-4 px-4 sm:mx-0 sm:px-0">
                            ${filterCategories.map(cat => `
                                <button onclick="setFilter('${cat.id}')" class="flex-shrink-0 flex items-center gap-2 px-4 py-2.5 rounded-xl border transition-all text-xs font-bold ${activeFilter === cat.id ? 'bg-luxDark text-white border-luxDark shadow-md' : 'bg-white text-gray-600 border-gray-200 hover:border-luxGold hover:text-luxGold'}">
                                    <i data-lucide="${cat.icon}" class="w-3.5 h-3.5 ${activeFilter === cat.id ? 'text-luxGold' : ''}"></i> ${cat.label}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
                        ${filtered.length > 0 ? filtered.map(renderProductCard).join('') : '<div class="col-span-full py-10 text-center text-gray-400 text-sm">Nenhuma fragrância encontrada para este perfil.</div>'}
                    </div>
                </main>
            `;
            return html;
        };

        // --- RENDERIZAÇÃO PRODUTO ---
        const getProductHTML = () => {
            const p = catalog.find(i => i.id === selectedProductId);
            if (!p) return '';

            const inst = p.price / p.installments;

            // Criar a string de notas repetidas para o efeito de looping (marquee)
            const notasLoop = `${p.notesCarousel} &nbsp;&nbsp;&nbsp;&bull;&nbsp;&nbsp;&nbsp; `.repeat(4);

            return `
                <!-- Topbar Produto -->
                <div class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 h-16 flex items-center px-4 justify-between transition-all">
                    <button onclick="goHome()" class="p-2 -ml-2 text-gray-600 hover:text-luxGold flex items-center gap-1 font-bold text-[10px] uppercase tracking-widest"><i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar</button>
                    <button onclick="toggleCart(true)" class="relative p-2 text-gray-800"><i data-lucide="shopping-bag" class="w-5 h-5"></i></button>
                </div>

                <main class="bg-white min-h-screen pb-32 pt-6">
                    
                    <!-- Imagem Menor e Mais Elegante -->
                    <div class="w-2/3 max-w-[260px] mx-auto aspect-[4/5] bg-[#FAFAFA] p-6 flex justify-center items-center relative rounded-3xl shadow-sm border border-gray-100 mb-6 mt-4">
                        <img src="${p.image}" class="max-w-full max-h-full object-contain drop-shadow-xl mix-blend-multiply" />
                    </div>

                    <div class="max-w-3xl mx-auto px-5 py-2">
                        <!-- Badges de Autoridade -->
                        <div class="flex flex-wrap gap-2 mb-4 justify-center">
                            <span class="bg-luxDark text-luxGold text-[9px] uppercase tracking-widest font-bold px-3 py-1.5 rounded-full"><i data-lucide="check-circle-2" class="w-3 h-3 inline pb-0.5"></i> 100% Original</span>
                            <span class="bg-gray-100 text-gray-600 text-[9px] uppercase tracking-widest font-bold px-3 py-1.5 rounded-full"><i data-lucide="clock" class="w-3 h-3 inline pb-0.5"></i> Fixação: ${p.fixation}</span>
                        </div>

                        <!-- Títulos -->
                        <div class="text-center mb-6">
                            <p class="text-[10px] text-luxGold uppercase tracking-widest font-bold mb-1">${p.brand}</p>
                            <h1 class="font-serif text-2xl sm:text-3xl font-bold text-gray-900 leading-tight mb-2">${p.name}</h1>
                            <p class="text-xs text-gray-500 italic max-w-sm mx-auto">"${p.shortDescription}"</p>
                        </div>

                        <!-- Preço -->
                        <div class="mb-4 text-center">
                            <div class="flex items-center justify-center gap-2 mb-1">
                                ${p.oldPrice ? `<span class="text-sm text-gray-400 line-through">${formatCurrency(p.oldPrice)}</span>` : ''}
                                <span class="text-4xl font-bold text-luxDark">${formatCurrency(p.price)}</span>
                            </div>
                            <p class="text-xs text-success font-semibold">em até ${p.installments}x de ${formatCurrency(inst)} sem juros</p>
                        </div>

                        <!-- Carrossel de Notas Olfativas (A sutilidade das frutas e elementos) -->
                        <div class="w-full bg-luxCreme border-y border-luxGold/10 py-2.5 mb-8 overflow-hidden relative" style="mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);">
                            <div class="animate-marquee">
                                <span class="text-[10px] text-gray-600 font-bold tracking-[0.2em] uppercase">${notasLoop}</span>
                            </div>
                        </div>

                        <!-- Gráfico de Acordes Visuais -->
                        <div class="mb-8 px-2">
                            <h3 class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-4 flex items-center gap-1.5"><i data-lucide="bar-chart-3" class="w-3 h-3"></i> O que você vai sentir</h3>
                            <div class="space-y-3 bg-[#FAFAFA] p-5 rounded-2xl border border-gray-100 shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)]">
                                ${p.accords.map(accord => `
                                    <div class="relative w-full h-8 bg-gray-200 rounded-lg overflow-hidden">
                                        <div class="${accord.color} h-full bar-fill flex items-center px-4" style="width: ${accord.level}%;">
                                            <span class="text-[10px] font-bold tracking-wider uppercase whitespace-nowrap z-10">${accord.name}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Descrição com "Ver Mais" -->
                        <div class="mb-10 px-2">
                            <h3 class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-3">A Experiência</h3>
                            <p id="product-desc" class="text-sm text-gray-600 leading-relaxed line-clamp-custom transition-all duration-300">${p.fullDescription}</p>
                            <button id="read-more-btn" onclick="toggleReadMore()" class="text-[10px] uppercase font-bold text-luxGold mt-3 flex items-center gap-1">Ler descrição completa <i data-lucide="chevron-down" class="w-3 h-3"></i></button>
                        </div>
                    </div>

                    <!-- Barra Fixa de Compra -->
                    <div class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-100 p-4 pb-safe z-40 shadow-[0_-10px_20px_rgba(0,0,0,0.04)] flex justify-center">
                        <button onclick="addToCart(${p.id})" class="w-full max-w-md bg-luxDark hover:bg-black text-white rounded-xl py-4 text-xs uppercase tracking-widest font-bold flex items-center justify-center gap-2 shadow-xl shadow-black/20 transition-all">
                            <i data-lucide="shopping-bag" class="w-4 h-4 text-luxGold"></i> Adicionar à Sacola
                        </button>
                    </div>
                </main>
            `;
        };

        const renderApp = () => {
            document.getElementById('app-root').innerHTML = currentView === 'home' ? getHomeHTML() : getProductHTML();
            const header = document.querySelector('header');
            if(currentView === 'product') header.style.display = 'none';
            else header.style.display = 'flex';
            renderIcons();
        };

        // Init
        renderApp();
        updateCartUI();
    </script>
</body>
</html>
